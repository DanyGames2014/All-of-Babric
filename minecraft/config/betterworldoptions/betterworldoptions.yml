world:
  # 0 = 128, 1 = 256, 2 = 512
  worldHeightLimit: 0
  # Fix terrain gen above height 128 in Default world type (may cause incompatibilities with other mods)
  fixTerrainGenDefault: false
  # Fixes caves cutting off at chunk boundaries
  caveFix: true
  # Fixes misaligned beaches and chunk boundary breaks
  beachFix: true
  ravineGeneration: true
  ravineGenWithOldFeatures: false
environment:
  alwaysSnowInWinterWorlds: true
  # Use old textures and sky when Old Features is enabled
  oldTexturesAndSky: true
player:
  walkingAnim: 0
