# The max amount of blocks the elevator will search for another elevator block
elevatorDistanceLimit: 20

# The max amount of blocks the elevator can pass through
blockPassthroughLimit: 4

# Makes non-suffocating blocks not count towards the block pass-through limit
ignoreBlocksThatDontSuffocatePlayerCheckingLimit: true

# Ignore non-suffocating blocks when checking if the area above the elevator isn't solid
ignoreBlocksThatDontSuffocatePlayerCheckingSafety: true

# Show an arrow that points at the direction of a directional elevator when sneaking
renderArrow: true
