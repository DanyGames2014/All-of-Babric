# Enables or disables SafeSquares completely.
enabled: true

# How many blocks away from the player to check for safe blocks.
renderDistance: 24

# How often blocks should be checked automatically, in ticks.
updateRate: 8

# If enabled, blocks that are unsafe under the sky will be highlighted.
safeSkyEnabled: true

# Color of blocks that are unsafe under the sky (hex code, #RRGGBB or #AARRGGBB).
safeSkyColor: "#DDDD00"

# If enabled, blocks that are unsafe in darkness will be highlighted.
safeDarkEnabled: true

# Color of blocks that are unsafe in darkness (hex code, #RRGGBB or #AARRGGBB).
safeDarkColor: "#FF2222"

# Scale of the cross, relative to the size of the block (1).
crossScale: 1.0

# How high above the block to render the cross, relative to the size of the block (1).
crossEpsilon: 0.125

# Thickness of the line, in pixels.
crossLineWidth: 2.0

# Light level considered safe from monster spawns (default 7).
safeLightLevel: 7
