gameplay:
  # Allow the server to register backpack crafting recipes.
  allowCrafting: true
  # Allow Chest Backpacks to generate in dungeon chests.
  allowDungeonLoot: true
  # Active slots in the first backpack tier (1–18).
  backpackCapacity: 6
  # Active slots in the second backpack tier (1–18; never below tier one).
  chestBackpackCapacity: 12
  # Active slots in the third backpack tier (1–18; never below tier two).
  doubleChestBackpackCapacity: 18
appearance:
  # Show backpack storage to the right of handled screens instead of the left.
  panelOnRight: false
