# MUD replaces grass on Y 63-66 in Swamplands biome.
surfaceRulesGen: true

# Features being new flora, if 'false' it overwrites other feature settings.
allFeaturesGen: true

# Fog has different colour in Swamplands biome.
newFogColour: true

# Generates holes with water on lower Y, works only on MUD.
muddyHolesGen: true

# Generates patches with SINKING MUD, works only on MUD.
sinkingMudGen: true

# Generates patches with PEAT.
peatBlobsGen: true

# Generates WILLOW trees in Swamplands.
willowTreeGen: true

# Generates OAK trees in Swamplands.
oakTreeGen: true

# Generates DEAD trees and DRIFTWOOD
deadTreeGen: true

# Generates patches of REEDS, CATTAILS and TALL BOG GRASS.
tallPlantsGen: true

# Generates patches of SHORT BOG GRASS.
shortPlantsGen: true

# Generates patches of vanilla TALL GRASS in Swamplands.
vanillaGrassGen: true

# Generates DUCKWEED, LILY PADS and FROST LILY PADS.
floatingPlantsGen: true

# Generates FROST LILY PADS on border of swamplands and taiga.
frostLilyGen: true

# Generates patches of wetlands FLOWERS.
flowerGen: true

# Generates patches of wetlands MUSHROOMS.
shroomsGen: true

# Generates FIREFLY BUSHES.
fireflyBushGen: true
